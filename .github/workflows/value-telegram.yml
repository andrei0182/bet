name: Pariuri cu valoare (Telegram)

# La fiecare 30 de minute rulează value_bot.py: compară cotele Superbet cu
# cotele corecte Pinnacle (fără marjă) pentru meciurile din următoarele
# VAL_WINDOW_H ore, postează pariurile noi cu avantaj >= VAL_MIN_EDGE %,
# închide pariurile terminate și, după POST_EVENING, publică bilanțul zilei.
# Secrete: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (aceleași ca la fh-telegram).
# Variabile opționale: VAL_MIN_EDGE, VAL_MIN_FAIR, VAL_MAX_FAIR, VAL_MIN_LIMIT,
# VAL_WINDOW_H, VAL_MAX_POST, POST_EVENING, POSTS.

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      evening:
        description: "Forțează bilanțul de seară acum"
        type: boolean
        default: false

concurrency:
  group: value-bot
  cancel-in-progress: false

permissions:
  contents: write  # comite data/value_bets.csv

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VAL_MIN_EDGE: ${{ vars.VAL_MIN_EDGE || '3' }}
      VAL_MIN_FAIR: ${{ vars.VAL_MIN_FAIR || '1.3' }}
      VAL_MAX_FAIR: ${{ vars.VAL_MAX_FAIR || '4' }}
      VAL_MIN_LIMIT: ${{ vars.VAL_MIN_LIMIT || '250' }}
      VAL_WINDOW_H: ${{ vars.VAL_WINDOW_H || '12' }}
      VAL_MAX_POST: ${{ vars.VAL_MAX_POST || '10' }}
      POST_EVENING: ${{ vars.POST_EVENING || '23:30' }}
      POSTS: ${{ vars.POSTS || 'on' }}
    steps:
      - name: Skip if Telegram secrets are missing
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID lipsesc -- adaugă-le în Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''

      - uses: actions/setup-python@v5
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: pip install "requests>=2.31"

      # Ziua ultimului bilanț trece de la o rulare la alta prin cache.
      - name: Restore state
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: actions/cache/restore@v4
        with:
          path: vstate
          key: value-state-${{ github.run_id }}
          restore-keys: value-state-

      - name: Scan
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python value_bot.py ${{ inputs.evening && '--evening' || '' }}

      - name: Save state
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && hashFiles('vstate/value_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: vstate
          key: value-state-${{ github.run_id }}

      - name: Commit bets log
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && hashFiles('data/value_bets.csv') != ''
        run: |
          git add data/value_bets.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update value bets log ($(TZ=Europe/Bucharest date +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
